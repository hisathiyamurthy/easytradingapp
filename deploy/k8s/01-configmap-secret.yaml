apiVersion: v1
kind: ConfigMap
metadata:
  name: easytrading-config
  namespace: easytrading
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  API_URL: "https://api.easytradingapp.com"
  FRONTEND_URL: "https://app.easytradingapp.com"
  REDIS_URL: "redis://redis:6379/0"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: easytrading-secrets
  namespace: easytrading
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGEME@postgres:5432/easytradingapp"
  SECRET_KEY: "CHANGEME-SECRET-KEY-IN-PRODUCTION"
  POSTGRES_PASSWORD: "CHANGEME-POSTGRES-PASSWORD"
  REDIS_PASSWORD: "CHANGEME-REDIS-PASSWORD"
  RABBITMQ_PASSWORD: "CHANGEME-RABBITMQ-PASSWORD"
  JWT_SECRET_KEY: "CHANGEME-JWT-SECRET"
  ENCRYPTION_KEY: "CHANGEME-ENCRYPTION-KEY"
